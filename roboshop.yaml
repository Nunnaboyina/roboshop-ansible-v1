- name: creating ec2 instances and route53
  hosts: local
  connection: local
  vars:
    instances: ['mongodb', 'redis', 'mysql', 'rabbitmq']
    action: create
  tasks:
  - name: creating ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      image_id: ami-0055977a6e828a4f4
      region: us-east-1
      security_groups: 
      - roboshop-common
      - roboshop-{{ item }}
    loop: "{{instances}}"
    when: action == "create"
- name: creating ec2 instances and route53
  hosts: local
  connection: local
  vars:
    instances: ['mongodb', 'redis', 'mysql', 'rabbitmq']
    action: create
    domain_name: saidevops.shop
  tasks:
  - name: creating ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      image_id: ami-0055977a6e828a4f4
      region: us-east-1
      security_groups: 
      - roboshop-common
      - "roboshop-{{ item }}"
    loop: "{{instances}}"
    when: action == "create"
    register: ec2_result

  - name: Print the Private IP Address
    debug:
      msg: "The private IP is: {{ ec2_result.instances[0].private_ip_address }}"
  

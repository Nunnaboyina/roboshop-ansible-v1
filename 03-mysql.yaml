- name: configuring mysql server
  hosts: mysql
  become: yes
  tasks: 
  - name: Enabling mysql
    command: dnf module enable mysql:8-4 -y

  - name: Installing mysql
    package:
      name: mysql-server
      state: present
  - name: Start the mysql service
    service:
      name: mysqld
      state: started
      enabled: yes

#ansible-galaxy collection install ansible.mysql  ------------- install this before running the playbook

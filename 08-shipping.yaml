- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven 3.9
    command: dnf module enable maven:3.9 -y
  - name: install maven and java
    dnf:
      name:
        - maven
        - java-25-openjdk-devel   # no need to create JAVA HOME
        - mysql
        - maven-openjdk25
      state: present

  - name: create system user
    user:
      name: roboshop
      create_home: false
      system: true
      path: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: delete app directory
    file:
      path: /app
      state: absent
  - name: delete the shipping data
    file:
      path: /tmp/shipping.zip
      state: absent
  - name: add directory
    file:
      path: /app
      state: directory

  - name: download the shipping data
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip  
  - name: unarchive shipping data to app folder
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: mvn version without JAVE_HOME
    command: mvn --version
    args:
      chdir: /app
    register: mvn_version

  - name: print mvn version without JAVA_HOME
    debug:
      msg: "{{mvn_version.stdout_lines}}"

  - name: build shipping
    command: mvn clean package
    args: 
      chdir: /app

  - name: moving shipping.jar 
    command: mv target/shipping.jar shipping.jar
    args:
      chdir: /app

  - name: checking the cities data exist or not
    command: mysql -h "{{mysql_host}}" -u root -p{{mysql_root_password}} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: count_cities
    ignore_errors: true  #### whenever we download the data, for sure there might be data available or not. 
    # so, we need set ignore_errors: True [to handle errors]. when ansible gets rc=1 error, ansible stops and exits. 

  - name: download all cities
    shell: mysql -h {{mysql_host}} -uroot -p{{mysql_root_password}} < /app/db/master-data.sql
    when: count_cities.rc != 0 or count_cities.stdout | int == 0
  
  - name: create system user
    shell: mysql -h {{mysql_host}} -uroot -p{{mysql_root_password}} < /app/db/app-user.sql
    
  - name: configure shipping service file
    template:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service

  - name: daemon reload 
    systemd_service:
      daemon_reload: true
  - name: restart shipping service file
    service:
      name: shipping
      state: restarted



  
